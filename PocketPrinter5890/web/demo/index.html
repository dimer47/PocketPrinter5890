<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PocketPrinter 5890 — Web demo</title>
<style>
  :root { color-scheme: light dark; --gap: 1rem; }
  body {
    font: 15px/1.5 system-ui, sans-serif;
    max-width: 820px; margin: 0 auto; padding: var(--gap);
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.2rem; }
  .sub { color: #888; margin-top: 0; }
  fieldset { border: 1px solid #8884; border-radius: 8px; margin: var(--gap) 0; }
  legend { font-weight: 600; padding: 0 0.4rem; }
  button { font: inherit; padding: 0.45rem 0.9rem; border-radius: 6px;
           border: 1px solid #8886; background: #8881; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: #0a84ff; color: white; border-color: transparent; }
  input, textarea, select { font: inherit; padding: 0.4rem; width: 100%;
                            box-sizing: border-box; border-radius: 6px;
                            border: 1px solid #8886; background: transparent; }
  textarea { font-family: ui-monospace, monospace; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 0 0 auto; }
  .grow { flex: 1 1 200px; }
  #status { padding: 0.5rem 0.8rem; border-radius: 6px; background: #8881; }
  #console { font-family: ui-monospace, monospace; font-size: 12px;
             height: 220px; overflow-y: auto; background: #8881;
             padding: 0.5rem; border-radius: 6px; }
  #console div { white-space: pre-wrap; }
  .tx { color: #0a84ff; } .rx { color: #30a14e; } .err { color: #d1242f; }
  canvas { max-width: 100%; background: white; border: 1px solid #8886; }
  .warn { background: #fb85161a; border-left: 3px solid #fb8516;
          padding: 0.6rem 0.8rem; border-radius: 4px; font-size: 0.9rem; }
</style>
</head>
<body>

<h1>PocketPrinter 5890</h1>
<p class="sub">Web Bluetooth demo — Chrome, Edge or Opera</p>

<div id="unsupported" class="warn" hidden>
  This browser does not support Web Bluetooth. Firefox and Safari do not
  implement it; use Chrome, Edge or Opera.
</div>

<fieldset>
  <legend>Connection</legend>
  <div class="row">
    <button id="connect" class="primary">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
    <button id="info" disabled>Read device info</button>
  </div>
  <p id="status">Not connected</p>
</fieldset>

<fieldset>
  <legend>Text</legend>
  <textarea id="text" rows="3">HELLO
This is a native text test.</textarea>
  <div class="row" style="margin-top: 0.5rem">
    <select id="align" style="width:auto">
      <option value="0">Left</option>
      <option value="1">Centre</option>
      <option value="2">Right</option>
    </select>
    <select id="size" style="width:auto">
      <option value="1">Size 1</option>
      <option value="2">Size 2</option>
      <option value="3">Size 3</option>
    </select>
    <label><input type="checkbox" id="boldText" style="width:auto"> Bold</label>
    <button id="printText" disabled>Print text</button>
  </div>
</fieldset>

<fieldset>
  <legend>Barcode</legend>
  <div class="row">
    <input id="codeContent" class="grow" value="5901234123457">
    <select id="symbology" style="width:auto">
      <option value="code128">Code 128</option>
      <option value="code39">Code 39</option>
      <option value="ean13" selected>EAN-13</option>
      <option value="ean8">EAN-8</option>
    </select>
    <button id="printCode" disabled>Print</button>
  </div>
  <canvas id="codePreview" style="margin-top:0.6rem"></canvas>
</fieldset>

<fieldset>
  <legend>Image</legend>
  <div class="row">
    <input type="file" id="file" accept="image/*" class="grow">
    <button id="printImage" disabled>Print image</button>
  </div>
  <canvas id="imagePreview" style="margin-top:0.6rem"></canvas>
</fieldset>

<fieldset>
  <legend>Paper</legend>
  <div class="row">
    <button id="feed" disabled>Feed 80 dots</button>
    <button id="feedLong" disabled>Feed 300 dots</button>
  </div>
</fieldset>

<fieldset>
  <legend>Hex console</legend>
  <div id="console"></div>
</fieldset>

<script type="module">
import {
  PocketPrinter, WebBluetoothTransport, PrintDocument,
  renderBarcode, Symbology, bitmapFromImage, bitmapToCanvas,
  toHex, Alignment, DitherMode,
} from '../dist/index.js';

const $ = (id) => document.getElementById(id);
const log = (kind, text) => {
  const line = document.createElement('div');
  line.className = kind;
  line.textContent = text;
  $('console').prepend(line);
};

if (!WebBluetoothTransport.isSupported) {
  $('unsupported').hidden = false;
}

const printer = new PocketPrinter(new WebBluetoothTransport(), {}, {
  onResponse: (response, raw) => {
    log('rx', `RX  ${toHex(raw)}${response.text ? '   ' + response.text : ''}`);
  },
  onInfo: (info) => {
    const parts = [];
    if (info.model) parts.push(info.model);
    if (info.firmware) parts.push(info.firmware);
    if (info.battery !== undefined) parts.push(`${info.battery}%`);
    if (parts.length) $('status').textContent = `Connected — ${parts.join('  ')}`;
  },
});

const setConnected = (connected) => {
  for (const id of ['disconnect','info','printText','printCode','printImage','feed','feedLong']) {
    $(id).disabled = !connected;
  }
  $('connect').disabled = connected;
};

$('connect').onclick = async () => {
  try {
    $('status').textContent = 'Connecting…';
    const device = await printer.connect();
    $('status').textContent = `Connected to ${device.name}`;
    setConnected(true);
    await printer.readDeviceInformation();
  } catch (error) {
    $('status').textContent = `Failed: ${error.message}`;
    log('err', error.message);
  }
};

$('disconnect').onclick = async () => {
  await printer.disconnect();
  $('status').textContent = 'Not connected';
  setConnected(false);
};

$('info').onclick = () => printer.readDeviceInformation();

$('printText').onclick = async () => {
  await printer.printText($('text').value, {
    size: Number($('size').value),
    bold: $('boldText').checked,
    alignment: Number($('align').value),
  });
  log('tx', 'TX  text');
};

const updateCodePreview = () => {
  try {
    const bitmap = renderBarcode($('codeContent').value, $('symbology').value, { height: 70 });
    const canvas = bitmapToCanvas(bitmap);
    const target = $('codePreview');
    target.width = canvas.width;
    target.height = canvas.height;
    target.getContext('2d').drawImage(canvas, 0, 0);
    return bitmap;
  } catch (error) {
    log('err', error.message);
    return null;
  }
};

$('codeContent').oninput = updateCodePreview;
$('symbology').onchange = updateCodePreview;
updateCodePreview();

$('printCode').onclick = async () => {
  const bitmap = updateCodePreview();
  if (bitmap) {
    await printer.printBitmap(bitmap);
    log('tx', 'TX  barcode');
  }
};

let imageBitmap = null;
$('file').onchange = async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const image = new Image();
  image.src = URL.createObjectURL(file);
  await image.decode();
  imageBitmap = bitmapFromImage(image, { dither: DitherMode.FloydSteinberg });
  const canvas = bitmapToCanvas(imageBitmap);
  const target = $('imagePreview');
  target.width = canvas.width;
  target.height = canvas.height;
  target.getContext('2d').drawImage(canvas, 0, 0);
};

$('printImage').onclick = async () => {
  if (imageBitmap) {
    await printer.printBitmap(imageBitmap);
    log('tx', 'TX  image');
  }
};

$('feed').onclick = () => printer.feed(80);
$('feedLong').onclick = () => printer.feed(300);
</script>
</body>
</html>
